[package]
name = "devkit-desktop"
version = "0.3.0"
description = "Cross-platform project launcher and sync utility"
authors = ["Devkit"]
edition = "2021"

[lib]
name = "devkit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
